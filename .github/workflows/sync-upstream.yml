name: sync-upstream
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mmh
          fetch-depth: 0
      - run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git remote add upstream https://github.com/P3DROVFX/ii-p3drovfx.git
          git fetch upstream dev
          git merge --no-edit upstream/dev
          git push origin mmh
